  <link rel="icon" href="data:,"> <!-- TODO: replace with the real favicon once the logo exists; data:, stops browsers asking for /favicon.ico (a 404 on every first visit) -->
  <script>
    /* Preload the two fonts used above the fold. Skipped over file:// (a CORS-mode font request is blocked there and logs an error).
       Blade: two static <link rel="preload" href="..." as="font" type="font/woff2" crossorigin> tags instead. */
    if (location.protocol !== 'file:') ['public-sans', 'urbanist'].forEach(function (n) {
      var l = document.createElement('link'); l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = '';
      l.href = 'assets/fonts/' + n + '-latin-wght-normal.woff2'; document.head.appendChild(l);
    });
  </script>
