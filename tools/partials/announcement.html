  <!-- blade: @if topbar banner is active (style: lilac | cream | sky) -->
  <div class="topbar topbar--lilac" data-topbar role="region" aria-label="Announcement">
    <p class="topbar__text"><span>Island-wide delivery in <span data-cfg="delivery_island_days">2–4</span> days</span><span class="topbar__extra"> · Free over <span data-cfg="free_shipping_over">Rs. 7,500</span></span></p>
    <button type="button" class="topbar__close" data-topbar-dismiss aria-label="Dismiss announcement"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"></use></svg></button>
  </div>
