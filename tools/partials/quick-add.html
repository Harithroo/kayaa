  <div class="sheet" data-layer="quick-add" data-quick-add-sheet role="dialog" aria-modal="true" aria-labelledby="qa-title" aria-hidden="true">
    <div class="sheet__backdrop" data-close-layer></div>
    <div class="sheet__panel">
      <div class="quick-add__head">
        <div class="media media--tile quick-add__thumb" data-placeholder data-qa-thumb style="--tone: var(--tone-1)"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-image"></use></svg></div>
        <div class="quick-add__title">
          <h2 id="qa-title" data-qa-name>Product name</h2>
          <p class="price"><span class="price__now" data-qa-price>Rs. 0</span> <s class="price__was" data-qa-was hidden></s></p>
        </div>
        <button type="button" class="icon-btn icon-btn--plain quick-add__close" data-close-layer aria-label="Close quick add"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"></use></svg></button>
      </div>
      <form data-quick-add-form action="{{root}}cart.html" method="post">
        <fieldset class="quick-add__group">
          <legend>Size</legend>
          <!-- TODO: sizes and stock come from the product variants; app.js fills this list from the card (data-sizes) -->
          <div class="quick-add__options" data-qa-sizes>
            <label class="size-box"><input class="visually-hidden" type="radio" name="size" value="3-6m" data-label="3–6m" checked><span>3–6m</span></label>
          </div>
        </fieldset>
        <fieldset class="quick-add__group">
          <legend>Colour</legend>
          <div class="quick-add__options quick-add__options--colours" data-qa-colours>
            <label class="swatch"><input class="visually-hidden" type="radio" name="colour" value="lilac" data-label="Lilac" checked><span class="dot dot--lilac" aria-hidden="true"></span><span class="visually-hidden">Lilac</span></label>
          </div>
        </fieldset>
        <button type="submit" class="btn btn--primary btn--lg btn--block">Add to cart</button>
      </form>
    </div>
  </div>
