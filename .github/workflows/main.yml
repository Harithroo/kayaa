name: Deploy Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Never let two deploys overlap: FTP sync is not atomic. Queue, never cancel.
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy to FTP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Create Laravel Storage Directories
        run: mkdir -p storage/framework/{cache/data,sessions,views} storage/logs bootstrap/cache

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude
            **/.claude/**
            **/node_modules/**
            tests/**
            .env
            .env.*
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**

      # The FTP sync copies files but cannot change the schema, and this host has
      # no SSH. Ask the app to migrate itself; the token is checked server-side
      # and the route 404s when DEPLOY_TOKEN is not set. Skipped without secrets.
      - name: Run Migrations & Rebuild Caches
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_ORIGIN_IP: ${{ secrets.DEPLOY_ORIGIN_IP }}
        if: ${{ env.DEPLOY_URL != '' && env.DEPLOY_TOKEN != '' }}
        run: |
          set -uo pipefail
          # No --location on purpose: a redirect would silently turn the POST into a GET,
          # so DEPLOY_URL must already be the final https URL.
          case "$DEPLOY_URL" in https://*) ;; *) echo "::error::DEPLOY_URL must start with https://"; exit 1 ;; esac
          HOST=$(printf '%s' "$DEPLOY_URL" | awk -F/ '{print $3}')
          echo "Calling $HOST"

          # Cloudflare serves a managed challenge to runner IPs, which no token
          # can answer. With DEPLOY_ORIGIN_IP set, connect straight to the origin
          # instead. SNI and Host stay correct, so TLS still verifies normally.
          RESOLVE=()
          if [ -n "${DEPLOY_ORIGIN_IP:-}" ]; then
            RESOLVE=(--resolve "$HOST:443:$DEPLOY_ORIGIN_IP")
            echo "Bypassing Cloudflare via origin"
          else
            echo "::warning::DEPLOY_ORIGIN_IP is not set: this call goes through Cloudflare, which challenges runner IPs (403 'Just a moment...')."
          fi

          # Retry only on "no answer" / gateway errors. A 500 means artisan itself failed: stop and show it.
          for i in 1 2 3; do
            # The body is not read, but LiteSpeed 403s a POST with no
            # Content-Type before it ever reaches PHP, so send one.
            code=$(curl -s -o resp.txt -w '%{http_code}' --max-time 300 "${RESOLVE[@]}" \
                   --request POST "$DEPLOY_URL" \
                   --header "X-Deploy-Token: $DEPLOY_TOKEN" \
                   --header "Content-Type: application/json" \
                   --data '{}') || true
            echo "attempt $i: HTTP $code"
            if grep -q "Just a moment" resp.txt 2>/dev/null; then echo "Blocked by Cloudflare: set the DEPLOY_ORIGIN_IP secret."; exit 1; fi
            case "$code" in
              200) cat resp.txt; echo; exit 0 ;;
              301|302|307|308) echo "Redirected: set DEPLOY_URL to the final https URL."; exit 1 ;;
              404) echo "404: DEPLOY_TOKEN differs from the server's .env, or the route isn't deployed."; exit 1 ;;
              403) echo "403 from the origin firewall:"; sed 's/<[^>]*>/ /g' resp.txt | tr -s ' \n' | head -c 400; echo; exit 1 ;;
              000|502|503|504) head -c 400 resp.txt 2>/dev/null; echo; sleep 10 ;;
              *) echo "Migration failed:"; cat resp.txt; echo; exit 1 ;;
            esac
          done
          echo "Server did not answer after 3 attempts."; exit 1

      # Last line of defence: the deploy can report success while the site is
      # down, because the FTP sync only knows whether bytes arrived.
      - name: Smoke Check
        if: ${{ env.SITE_URL != '' }}
        env:
          SITE_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_ORIGIN_IP: ${{ secrets.DEPLOY_ORIGIN_IP }}
        run: |
          set -uo pipefail
          SITE_URL=$(printf '%s' "$SITE_URL" | awk -F/ '{print $1"//"$3"/"}')   # site root
          HOST=$(printf '%s' "$SITE_URL" | awk -F/ '{print $3}')

          # Same origin bypass as the migrate step: without it this check
          # measures Cloudflare rather than the site.
          RESOLVE=()
          if [ -n "${DEPLOY_ORIGIN_IP:-}" ]; then RESOLVE=(--resolve "$HOST:443:$DEPLOY_ORIGIN_IP"); fi

          # One asset from this build's Vite manifest: if the page references it, the new build is live.
          ASSET=$(jq -r '.[].file' public/build/manifest.json 2>/dev/null | grep -m1 -E '\.(css|js)$' || true)

          # 403 is deliberately NOT accepted: a Cloudflare "Just a moment..." challenge
          # is a 403. The storefront answers 200 even behind the coming-soon notice.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o home.html -w '%{http_code}' --max-time 60 "${RESOLVE[@]}" "$SITE_URL") || true
            echo "attempt $i: $SITE_URL -> $code"
            if grep -q "Just a moment" home.html 2>/dev/null; then echo "Cloudflare challenge, not the site: set DEPLOY_ORIGIN_IP."; exit 1; fi
            case "$code" in
              200)
                if [ -n "$ASSET" ] && ! grep -qF "$ASSET" home.html; then
                  echo "::warning::Home page does not reference $ASSET from this build (stale view cache, or a page without Vite assets)."
                fi
                exit 0 ;;
              301|302) exit 0 ;;
              403) echo "403: a Cloudflare challenge, or the server refused the request."; exit 1 ;;
            esac
            sleep 10
          done
          [ "$code" = 000 ] && echo "No response at all: DNS, TLS or the origin is down."
          exit 1
