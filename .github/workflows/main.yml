name: Deploy Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Create Laravel Storage Directories
        run: mkdir -p storage/framework/{cache/data,sessions,views} storage/logs bootstrap/cache

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            .env
            .env.*
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**

      # The FTP sync copies files but cannot change the schema, and this host has
      # no SSH. Ask the app to migrate itself; the token is checked server-side
      # and the route 404s when DEPLOY_TOKEN is not set. Skipped without secrets.
      - name: Run Migrations & Rebuild Caches
        if: ${{ env.DEPLOY_URL != '' && env.DEPLOY_TOKEN != '' }}
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_ORIGIN_IP: ${{ secrets.DEPLOY_ORIGIN_IP }}
        run: |
          set -euo pipefail
          HOST=$(printf '%s' "$DEPLOY_URL" | awk -F/ '{print $3}')
          echo "Calling $HOST"

          # Cloudflare serves a managed challenge to runner IPs, which no token
          # can answer. With DEPLOY_ORIGIN_IP set, connect straight to the origin
          # instead. SNI and Host stay correct, so TLS still verifies normally.
          RESOLVE=()
          if [ -n "${DEPLOY_ORIGIN_IP:-}" ]; then
            RESOLVE=(--resolve "$HOST:443:$DEPLOY_ORIGIN_IP")
            echo "Bypassing Cloudflare via origin $DEPLOY_ORIGIN_IP"
          fi

          # --fail-with-body so a 4xx/5xx still prints artisan's output before failing.
          # No --location on purpose: set DEPLOY_URL to the final https URL so a
          # redirect surfaces as an error instead of silently becoming a GET.
          # The body is not read, but LiteSpeed 403s a POST with no
          # Content-Type before it ever reaches PHP — so send one.
          curl --silent --show-error --fail-with-body \
               --max-time 300 \
               "${RESOLVE[@]}" \
               --request POST "$DEPLOY_URL" \
               --header "X-Deploy-Token: $DEPLOY_TOKEN" \
               --header "Content-Type: application/json" \
               --data '{}'
